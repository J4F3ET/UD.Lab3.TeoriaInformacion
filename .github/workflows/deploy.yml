name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      - name: La imagen construye
        run: docker build -t tic-codec-web:ci .

  desplegar:
    name: Desplegar en Proxmox
    needs: pruebas
    # Nunca en pull requests: el runner vive en el servidor de casa.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, tic-codec]
    environment:
      name: produccion
      url: ${{ vars.URL_PUBLICA }}
    concurrency:
      group: despliegue-produccion
      cancel-in-progress: false
    env:
      COMPOSE: docker compose -f deploy/compose.yaml -p tic-codec
    steps:
      - uses: actions/checkout@v4

      - name: Construir y levantar
        run: $COMPOSE up -d --build --remove-orphans

      - name: Esperar a que la app esté sana
        run: |
          for i in $(seq 1 30); do
            estado=$(docker inspect -f '{{.State.Health.Status}}' "$($COMPOSE ps -q app)")
            echo "intento $i: $estado"
            [ "$estado" = healthy ] && exit 0
            sleep 3
          done
          $COMPOSE logs --tail 100 app
          exit 1

      - name: Estado de Tailscale / Funnel
        # Tailscale está instalado en el LXC (no en un contenedor); ver deploy/README.md.
        run: |
          if ! command -v tailscale >/dev/null; then
            echo "::warning title=Sin Tailscale::Tailscale no está instalado en el LXC; la app solo responde en 127.0.0.1:5000."
            exit 0
          fi
          tailscale funnel status || true
          if ! tailscale funnel status 2>/dev/null | grep -q "Funnel on"; then
            echo "::warning title=Funnel apagado::En el LXC, como root: tailscale funnel --bg 5000"
          fi

      - name: Limpiar imágenes viejas
        if: always()
        run: docker image prune -f
