# Catálogo de servicios del despliegue. Lo lee el script de despliegue (bash, `IFS='|' read`).
#
# Formato: campos separados por `|`; los espacios alrededor se recortan; `-` = nada.
# Las líneas que empiezan con # y las vacías se ignoran.
#
#   nombre   : nombre del servicio en deploy/compose.yaml.
#   tipo     : app = se construye desde el repo y se despliega azul/verde. Su huella es el hash de
#                    sus entradas y da la etiqueta de imagen `app-<huella>`.
#              aux = contenedor sin build: imagen externa con versión fija (nunca :latest),
#                    se levanta con `compose up -d`. Para el proxy la salud se comprueba a través
#                    de :5000.
#   entradas : archivos/carpetas del repo que entran en la huella (separados por espacios).
#   salud    : ruta HTTP de salud a comprobar, o `-` si no tiene.
#   critico  : si = es el mínimo garantizado: el vigía lo levanta y el despliegue falla si no queda
#                   sano.
#              no = solo avisa.
#
# nombre   | tipo | entradas (para la huella)       | salud  | critico
app        | app  | Dockerfile requirements.txt src | /salud | si
proxy      | aux  | deploy/nginx                    | /salud | si
limpieza   | aux  | -                               | -      | si
