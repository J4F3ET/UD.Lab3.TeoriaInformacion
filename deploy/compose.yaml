# Despliegue en el LXC: la app + un sidecar de Tailscale que la publica con
# Funnel en https://<TS_HOSTNAME>.<tailnet>.ts.net (puerto 443, sin :puerto en la URL).
#
# La app comparte la red del contenedor de Tailscale (network_mode), así que
# Tailscale la alcanza en 127.0.0.1:8000 y no se publica ningún puerto en el LXC.
#
# Uso (lo hace el workflow de GitHub Actions en el runner del LXC):
#   TS_AUTHKEY=tskey-... docker compose -f deploy/compose.yaml -p tic-codec up -d --build
name: tic-codec

services:
  tailscale:
    image: ${TS_IMAGE:-tailscale/tailscale:stable}
    hostname: ${TS_HOSTNAME:-tic-codec}
    environment:
      # Solo se usa en el primer arranque; después la identidad queda en el volumen ts-state.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_EXTRA_ARGS: --advertise-tags=tag:tic-codec
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      # Modo userspace: no necesita /dev/net/tun, así funciona en un LXC no privilegiado.
      TS_USERSPACE: "true"
    volumes:
      - ts-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tic-codec-web:latest
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      TIC_MAX_MB: ${TIC_MAX_MB:-64}
      TIC_TRABAJOS: ${TIC_TRABAJOS:-1}
      TIC_TTL_MIN: ${TIC_TTL_MIN:-30}
    tmpfs:
      - /tmp:size=${TIC_TMP_MB:-1024}m
    mem_limit: ${TIC_MEM:-3g}
    restart: unless-stopped

volumes:
  ts-state:
