# Proxy del despliegue azul/verde (se monta como /etc/nginx/conf.d, solo lectura).
#
# El destino NO está aquí: lo escribe el script de despliegue como estado en tiempo de ejecución
# en ${TIC_ESTADO}/proxy/upstream.conf (montado en /etc/nginx/upstream). Contenido exacto (una línea):
#
#   map "" $tic_app { default app-azul:5000; }
#
# (o app-verde:5000 según el slot activo; nombres de servicio compose y puerto interno 5000).
# Como proxy_pass usa una variable, nginx resuelve el nombre en cada petición con el DNS interno
# de Docker (resolver 127.0.0.11): si el contenedor activo se reinicia y cambia de IP, el proxy lo
# sigue sin recarga, y puede arrancar antes que la app (responde 502 hasta que esté). Solo cambiar
# de slot (cambia el map) requiere recargar.
# Este debe ser el único .conf de deploy/nginx: nginx carga todos los de conf.d.

include /etc/nginx/upstream/upstream.conf;

# DNS interno de Docker; valid=5s limita la caché del nombre e ipv6=off evita consultas AAAA.
resolver 127.0.0.11 valid=5s ipv6=off;

# Respeta X-Forwarded-Proto si ya viene (Tailscale Funnel lo manda); si no, usa el esquema local.
map $http_x_forwarded_proto $esquema {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;

    # La app aplica su propio límite (TIC_MAX_MB) y responde 413; nginx no debe cortar antes.
    client_max_body_size 2048m;

    # Las subidas grandes pasan directo a la app sin guardarse en disco en el proxy.
    proxy_request_buffering off;
    # Las respuestas (.tic, descargas) se entregan según llegan, sin acumular en disco.
    proxy_buffering off;

    # Salud del propio nginx (no depende de la app): la usa el healthcheck del contenedor proxy.
    location = /nginx-salud {
        access_log off;
        default_type text/plain;
        return 200 "ok
";
    }

    location / {
        proxy_pass http://$tic_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema;

        proxy_connect_timeout 5s;
        # Las conversiones largas pueden tardar: 15 min de margen en lectura y envío.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;

        # Sin reintentos a otro servidor: evita repetir una petición no idempotente (subidas).
        proxy_next_upstream off;
    }
}
