# Despliegue en el LXC: la interfaz gráfica (src/app.py) y su limpieza de datos.
#
# Tailscale NO va en un contenedor: está instalado en el propio LXC y publica la app con
#   tailscale funnel --bg 5000   →   https://tic-codec.<tailnet>.ts.net  (puerto 443)
# La app solo escucha en 127.0.0.1:5000 del LXC, así que no queda expuesta en la red local.
#
# Uso (lo hace el workflow de GitHub Actions en el runner del LXC):
#   docker compose -f deploy/compose.yaml -p tic-codec up -d --build
name: tic-codec

# Logs acotados: sin esto el log json de Docker crece sin límite y puede llenar el disco del LXC,
# que es una forma silenciosa de tumbar todo (Docker, la app y el runner).
x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tic-codec-gui:latest
    ports:
      - "127.0.0.1:${TIC_PUERTO:-5000}:5000"
    environment:
      # Límite de subida en el despliegue público (en local el defecto es 2 GB).
      TIC_MAX_MB: ${TIC_MAX_MB:-256}
    volumes:
      - datos:/app/data
    mem_limit: ${TIC_MEM:-3g}
    init: true
    logging: *logs
    restart: unless-stopped

  # La interfaz guarda cada fuente y sus .tic en data/gui/<id>/ y nunca los borra.
  # Expuesta a internet eso llenaría el disco: se borran las carpetas viejas cada 10 min.
  limpieza:
    image: busybox:stable
    volumes:
      - datos:/app/data
    command:
      - sh
      - -c
      - |
        while true; do
          find /app/data/gui -mindepth 1 -maxdepth 1 -type d -mmin +${TIC_TTL_MIN:-120} -exec rm -rf {} +
          sleep 600
        done
    logging: *logs
    restart: unless-stopped

volumes:
  datos:
